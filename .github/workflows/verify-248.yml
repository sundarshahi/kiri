name: verify-248
on:
  push:
    branches: [verify/248]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { path: head, ref: fix/248-init-holds-dns-sockets }
      - uses: actions/checkout@v4
        with: { path: base, ref: main, repository: libracoder/kiri }
      - name: Build main and the fix
        run: |
          for e in base head; do
            find "$e" -type f -exec touch {} +
            mkdir -p "$RUNNER_TEMP/$e-bin"
            docker run --rm -v "$PWD/$e:/src" -v "$RUNNER_TEMP/$e-bin:/out" -v t:/t -v reg:/usr/local/cargo/registry \
              -w /src -e CARGO_TARGET_DIR=/t rust:1-alpine sh -c \
              'apk add -q musl-dev && cargo build --release --locked -p kiri -p kiri-init && cp /t/release/kiri /t/release/kiri-init /out/'
          done
      - name: fmt and clippy for kiri-init on Linux (main vs the fix)
        run: |
          for e in base head; do
            docker run --rm -v "$PWD/$e:/src" -v t:/t -v reg:/usr/local/cargo/registry -w /src -e CARGO_TARGET_DIR=/t rust:1-alpine sh -c \
              'apk add -q musl-dev && rustup component add clippy rustfmt >/dev/null 2>&1; cargo clippy --locked -p kiri-init 2>&1 | grep -E "^(warning|error)" | sort | uniq -c | sort -rn > /src/clippy.txt; echo "'$e' pid1.rs rustfmt(160) diffs: $(rustfmt --edition 2021 --config max_width=160 --check crates/kiri-init/src/linux/pid1.rs 2>&1 | grep -c ^Diff)"'
          done
          echo "== clippy lines only on the fix:"; diff <(sort base/clippy.txt) <(sort head/clippy.txt) | grep '^>' || echo none
          docker run --rm -v "$PWD/head:/src" -v t:/t -v reg:/usr/local/cargo/registry -w /src -e CARGO_TARGET_DIR=/t rust:1-alpine sh -c \
            'apk add -q musl-dev; cargo clippy --locked -p kiri-init 2>&1 | grep -B2 -A8 "pid1.rs" | head -40 || true'
      - name: Start both engines
        run: |
          for e in base head; do
            W=$RUNNER_TEMP/$e-run; mkdir -p "$W"
            docker run -d --name kiri-$e --privileged --tmpfs /run -v kiri-lib-$e:/var/lib/kiri -v kiri-store-$e:/root/.local/share/kiri \
              -v "$RUNNER_TEMP/$e-bin:/opt/kiri:ro" -v "$W:/root/.kiri/run" alpine:3.21 sh -c 'exec /opt/kiri/kiri daemon' >/dev/null
            i=0; while [ ! -S "$W/docker.sock" ] && [ $i -lt 120 ]; do i=$((i+1)); sleep 0.5; done
            sudo docker context create kiri-$e --docker host=unix://$W/docker.sock >/dev/null
            sudo docker --context kiri-$e pull -q alpine:3.21 >/dev/null
          done
      - name: The issue's case, 3 times each
        run: |
          set +e
          for e in base head; do
            D="sudo docker --context kiri-$e"
            for n in 1 2 3; do
              $D network create n1 >/dev/null; s1=$($D network inspect -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' n1)
              $D run -d --name n1c --network n1 alpine:3.21 sleep 600 >/dev/null
              $D run -d --name keeper --init alpine:3.21 sleep 600 >/dev/null
              $D rm -f n1c >/dev/null; $D network rm n1 >/dev/null
              l=$(docker exec kiri-$e netstat -lun | awk '$4 ~ /:53$/ {print $4}' | tr '\n' ' ')
              $D network create n2 >/dev/null; s2=$($D network inspect -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' n2)
              out=$($D run --rm --network n2 alpine:3.21 echo started 2>&1 | tail -1)
              echo "$e run $n: n1=$s1 n2=$s2 :53 after rm=[$l] -> $out"
              $D rm -f keeper >/dev/null; $D network rm n2 >/dev/null
            done
          done
      - name: An --init PID 1 and other containers' stdin
        if: false
        run: |
          set +e
          for e in base head; do
            D="sudo docker --context kiri-$e"
            start=$(date +%s)
            ( sleep 4; echo hi ) | timeout 25 $D run -i --rm --name catter alpine:3.21 cat > /tmp/cat-$e 2>&1 &
            sleep 2; $D run -d --name keeper3 --init alpine:3.21 sleep 600 >/dev/null
            wait $!; rc=$?
            echo "$e: cat with stdin closed at 4s -> exit=$rc after $(( $(date +%s)-start ))s output=$(cat /tmp/cat-$e | tr '\n' ' ')"
            $D rm -f keeper3 catter >/dev/null 2>&1
          done
      - name: An --init container's own stdin, 3 times each
        run: |
          set +e
          for e in base head; do
            for n in 1 2 3; do
              t0=$(date +%s%N)
              out=$(echo x | timeout 20 sudo docker --context kiri-$e run -i --rm --init alpine:3.21 cat 2>&1); rc=$?
              echo "$e run $n: echo x | docker run -i --init alpine cat -> exit=$rc output=[$out] $(( ($(date +%s%N)-t0)/1000000 )) ms"
            done
          done
      - name: --init itself still behaves
        run: |
          set +e
          for e in base head; do
            D="sudo docker --context kiri-$e"
            $D run --rm --init alpine:3.21 sh -c 'exit 7'; echo "$e exit code: $?"
            echo "$e fds in PID 1: $($D run --rm --init alpine:3.21 sh -c 'ls /proc/1/fd | tr "\n" " "')"
            $D run -d --name sig --init alpine:3.21 sleep 600 >/dev/null; t0=$(date +%s%N)
            $D stop -t 10 sig >/dev/null; echo "$e stop took $(( ($(date +%s%N)-t0)/1000000 )) ms, exit $($D inspect -f '{{.State.ExitCode}}' sig)"; $D rm sig >/dev/null
            echo "$e tty: $($D run --rm -t --init alpine:3.21 sh -c 'tty; echo ok' | tr -d '\r' | tr '\n' ' ')"
          done
      - name: Full e2e suite, main vs the fix
        run: |
          set +e
          for e in base head; do
            ( cd head && sudo env DOCKER_CONTEXT=kiri-$e timeout 3000 bash tests/e2e.sh > $RUNNER_TEMP/e2e-$e.log 2>&1 )
            echo "$e e2e exit=$?"; tail -4 $RUNNER_TEMP/e2e-$e.log
            grep -E "^  FAIL" $RUNNER_TEMP/e2e-$e.log | sed 's/:.*//' | sort > $RUNNER_TEMP/fails-$e
          done
          echo "== failing only on the fix:"; comm -13 $RUNNER_TEMP/fails-base $RUNNER_TEMP/fails-head
          echo "== failing only on main:"; comm -23 $RUNNER_TEMP/fails-base $RUNNER_TEMP/fails-head
          grep -n "network-rm-init-dns" $RUNNER_TEMP/e2e-*.log
